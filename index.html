<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Roundivyan Times</title>
  <meta name="description" content="The Roundivyan Times newspaper archive.">
  <link rel="stylesheet" href="assets/site.css?v=6">
  <link rel="stylesheet" href="assets/tfr-joke.css?v=2">
</head>
<body>
  <header class="site-header shell">
    <img class="masthead" src="logo.png" alt="The Roundivyan Times">
  </header>

  <nav class="navbar">
    <div class="shell nav-inner">
      <form class="issue-jump" data-issue-jump>
        <label for="issue-jump-input">Newspaper</label>
        <input id="issue-jump-input" data-issue-jump-input type="text" inputmode="text" autocomplete="off" placeholder="48 or XLVIII" aria-label="Newspaper week number or Roman numeral">
        <button type="submit">Go</button>
        <span class="jump-error" data-jump-error aria-live="polite"></span>
      </form>
      <a class="newsletter-nav" href="#newsletters">Newsletters</a>
    </div>
  </nav>

  <main>
    <section class="latest shell">
      <div class="latest-copy">
        <p class="label">Latest issue</p>
        <p class="week" data-latest-week>Loading</p>
        <h1 data-latest-text>Loading</h1>
        <a class="button" data-latest-link href="#archive">Read issue</a>
      </div>
      <div class="latest-art">
        <img data-art-cycle src="images/image2.png" alt="The Roundivyan Times artwork">
      </div>
    </section>

    <section class="section shell" id="archive">
      <h2>Archive</h2>
      <div class="archive" data-archive><p class="loading">Loading</p></div>
    </section>

    <section class="section shell newsletters-home" id="newsletters">
      <h2>Newsletters</h2>
      <div class="newsletter-links">
        <a data-local-route href="newsletter6/">Newsletter VI</a>
        <a data-local-route href="newsletter4/">Newsletter IV</a>
        <a data-local-route href="newsletter3/">Newsletter III</a>
      </div>
      <p class="note">Newsletters I, II and V are missing.</p>
    </section>
  </main>

  <button class="tfr-joke-toggle" type="button" data-tfr-joke-toggle aria-pressed="false" title="Definitely do not press this">DARK</button>

  <script src="assets/issues.js"></script>
  <script src="assets/archive.js"></script>
  <script src="assets/tfr-joke.js?v=2"></script>
</body>
</html>
